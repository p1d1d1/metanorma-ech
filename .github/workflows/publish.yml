name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Configure GitHub Packages as gem source
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials << EOF
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Build gem
        run: |
          cd metanorma-ech && gem build metanorma-ech.gemspec && cd ..
          cd isodoc-ech && gem build isodoc-ech.gemspec && cd ..

      - name: Push to GitHub Packages
        run: |
          for gem in metanorma-ech/*.gem isodoc-ech/*.gem; do
            gem push --key github \
              --host https://rubygems.pkg.github.com/${{ github.repository_owner }} \
              "$gem"
          done
