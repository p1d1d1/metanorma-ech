name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Run RSpec tests ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Debug GitHub Context
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Ref: ${{ github.ref }}"
          
      - uses: actions/checkout@v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: "3.2"
          bundler-cache: true   # runs bundle install and caches automatically
     
      - name: Run tests
        run: bundle exec rspec

  # ── Publish gem to GitHub Packages on version tags ───────────────────────
  publish:
    needs: test
    runs-on: ubuntu-latest
    # if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    
    permissions:
      packages: write
      contents: read

    steps:
      - name: Debug Publish Context
        run: |
          echo "Publish job was triggered!"
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Ref: ${{ github.ref }}"
          
      - uses: actions/checkout@v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Configure GitHub Packages as gem source
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials << EOF
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Build gem
        run: |
          gem build metanorma-ech/metanorma-ech.gemspec
          gem build isodoc-ech/isodoc-ech.gemspec

      - name: Push to GitHub Packages
        run: |
          for gem in *.gem; do
            gem push --key github \
              --host https://rubygems.pkg.github.com/${{ github.repository_owner }} \
              "$gem"
          done
