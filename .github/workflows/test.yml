name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: "3.2"
          bundler-cache: false
          
      - name: Install dependencies
        run: bundle install
        
      - name: Run tests
        run: bundle exec rspec
